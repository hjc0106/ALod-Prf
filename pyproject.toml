[project]
name = "alod-prf-detail"
version = "2.0.0"
description = "PRF v2 detail metrics: incremental kernel, spacing, and their component-wise max."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prf_detail*"]
